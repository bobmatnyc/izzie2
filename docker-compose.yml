# Docker Compose for Izzie2 Development Environment
# Provides Redis caching infrastructure for local development

version: '3.8'

services:
  # Redis Cache Server
  redis:
    image: redis:7-alpine
    container_name: izzie2-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - REDIS_REPLICATION_MODE=master
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - izzie2-network

  # Redis Commander (Web UI for Redis management)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: izzie2-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - izzie2-network

  # Optional: Postgres for comparison with cached vs non-cached queries
  postgres:
    image: postgres:15-alpine
    container_name: izzie2-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: izzie2_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # pragma: allowlist secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - izzie2-network

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  izzie2-network:
    driver: bridge
